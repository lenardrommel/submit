mode:
  local:
    template: "./submit/templates/local_job_cmd.j2"
    runtime: "venv"
    shell_executable: "bash"
  cloud_local:
    template: "./submit/templates/cloud_local_job_cmd.j2"
    runtime: "conda"
    shell_executable: "bash"
  slurm:
    template: "./submit/templates/slurm_job.sh.j2"
    runtime: "singularity"

runtime:
  venv:
    python_cmd: "./.venv/bin/python"
  conda:
    python_cmd: "python"
    pre_command: |
      eval "$(conda shell.bash hook)"
      conda activate nosplace-py311
  singularity:
    python_cmd: "python"
    command_wrapper: "singularity exec --bind /mnt:/mnt --nv python.sif bash -lc"

scripts:
  fit_prior_bayesopt_ood:
    path: "./luno_experiments/scripts/fit_bayesopt.py"
    default_args:
      data_name: ["pos_2", "pos_neg_2", "pos_neg_flip_2", "base_2", "flip_2"]
      seed: [0]
      search_space_file: "./submit/configs/prior_search_spaces/ood_kernel_exprs.json"
      n_trials: 10
      objective_metric: "val_nll"
      num_startup_trials: 4
      reuse_cached_trials: "True"
      resume_study: "True"
      max_iter: 40
      num_samples: 40
      cross_validate: "True"
      wandb: "True"
